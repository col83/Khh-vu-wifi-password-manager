name: Build Debug Android app

env:
  GRADLE_OPTS: "-Xmx2048M -Dfile.encoding=UTF-8"

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Debug apk
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-cleanup: on-success
          cache-overwrite-existing: true

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --info

      - name: Get commit hash
        id: commit
        run: echo "short_sha=$(git log -1 --format=%h)" >> "$GITHUB_OUTPUT"

      - name: Rename APK file
        run: |
          mv ./app/build/outputs/apk/debug/app-debug.apk ./app/build/outputs/apk/debug/wifi_password_manager_debug_${{ steps.commit.outputs.short_sha }}.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: wifi_password_manager_debug_${{ steps.commit.outputs.short_sha }}
          path: ./app/build/outputs/apk/debug/wifi_password_manager_debug_${{ steps.commit.outputs.short_sha }}.apk
          archive: false
          if-no-files-found: error
          retention-days: 1
